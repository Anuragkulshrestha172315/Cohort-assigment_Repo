<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Too-Yumm</title>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <nav>
        <div class="tag">
          <img
            src="https://encrypted-tbn1.gstatic.com/images?q=tbn:ANd9GcQAVbf2P6Qs2kMMReJe7dlmYoPaucpAqz0oVb0Bm1Mr7AI6fR01"
            alt=""
          />
          <h1>SunMall</h1>
        </div>
        <div class="link">
          <a href="#">HOME</a>
          <a href="#">ABOUT</a>
          <a href="#">CHIPS</a>
          <a href="#">SERIVES</a>
          <a href="#">CONTACT</a>
        </div>
        <div class="search">
          <i class="ri-search-line"></i>
          <input
            id="search_box"
            type="text"
            placeholder="Search for chips..."
          />
          <div class="cart">
            <i class="ri-shopping-bag-fill"></i>
            <span>4</span>
          </div>
        </div>
      </nav>
      <section>
        <div class="left">
          <div>
            <button class="btn">100% REAL INGREDIENT</button>
          </div>
          <div class="title">
            <h1>EAT OUT <span class="span">GRILLED</span> <br> PHOTO CHIPS</h1>
          </div>
          <div class="para">
            <p>
              Satisfying savory Chinese meat sauce chips <br> 40% without any
              hard-to-find ingredients.
            </p>
          </div>
          <div class="cart">
            <div class="cart_btn">
              <i class="ri-briefcase-line"></i>
              <button>ADD TO CART</button>
            </div>
            
            <div class="count">
                    <div class="count_num" id="neg">-</div>
                    <div class="count_num" id="digit">2</div>
                    <div class="count_num" id="pos">+</div>
            </div>
          </div>
            <div class="identities">
                <div>
                    <h3>100% NATURAL</h3>
                    <P>No artifial flavour</P>
                </div>
                <div>
                    <h3>OVEN GRILLED</h3>
                    <p>Not fried</p>
                </div>
                <div>
                    <h3>TASTY & CRUNCHY</h3>
                    <p>Inresistible bite</p>
                </div>
            </div>
          </div>
        </div>
        <div class="center">
          <img src="./toyum-removebg-preview.png" alt="" />
          <div class="circle"></div>
        </div>
        <div class="right"></div>
      </section>
      <footer>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
      </footer>
    </main>
  </body>
</html>
