<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Comm</title>
    <link rel="stylesheet" href="eCom.css">
</head>
<body>
    <main>
        <nav>
            <div class="logo">
                <h1>E-Comm</h1>
            </div>
            <div>
                <button class="add">Add Product</button>
            </div> 
        </nav>

        <div class="Product">
            <div class="product_card">
                <div class="img">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQzHW-r_qywHpYLH6pOcUrhZeBRAtLGUp1YZdlfAWh8EQ&s=10" alt="">
                </div>
                <div class="text">
                    <h2>shoes</h2>
                    <p>description</p>
                    <p>price</p>
                </div>
                <div class="btn">
                    <button class="btn1">Edit</button>
                    <button class="btn2">Delete</button>
                </div>
            </div>
        </div>


        <div class="form">
            <form>
                <input type="text" placeholder="Product Name">
                <input type="text" placeholder="Description">
                <input type="number" placeholder="Enter prices">
            </form>
        </div>
    </main>
    <script src="./eCom.js"></script>
</body>
</html>
