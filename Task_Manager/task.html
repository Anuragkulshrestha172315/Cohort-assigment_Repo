<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="./task.css">
</head>
<body>
    <main>
        <nav>
            <div class="logo">
                <h1>TASK_MANEGER</h1>
            </div>
            <div class="search">
            <input type="text" placeholder="Search the Task...">
            </div>
            <div class="dark">
                
            </div>           
        </nav>
        <section>
            <div class="progress">
                <div class="total"></div>
                <div class="complete"></div>
                <div class="due"></div>
            </div>
            <div>
                <div class="left"></div>
                <div class="right"></div>
            </div>
        </section>
    </main>
    <script src="./task.js"></script>
</body>
</html>
