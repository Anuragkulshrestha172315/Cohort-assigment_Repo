<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="./task.css">
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
</head>
<body>
    <main>
        <nav>
            <div class="logo">
                <h1>TASKMANEGER</h1>
            </div>
            <div class="search">
                <input type="text" placeholder="Search the Task..." ><i class="ri-search-line"></i>
            </div>
            <div class="dark">
                <i class="ri-sun-line"></i>
            </div>           
        </nav>
        <section>
            <div class="left">
                <div class="total">
                    <h2>0</h2>
                    <h1>Total Task</h1>
                </div>
                <div class="complete">
                    <h2>0</h2>
                    <h1>Complete Task</h1>
                </div>
                <div class="pending">
                    <h2>0</h2>
                    <h1>Pending Task</h1>
                </div>
                <div class="due">
                    <h2>0</h2>
                    <h1>Due Task</h1>
                </div>
            </div>
            <div class="right">
                <div class="create-section">
                    <h1>All Tasks</h1>
                    <div class="addtask">
                        <button class="add">Create Task</button><i class="ri-add-large-line"></i>
                    </div>
                </div>
                <div class="allTask">
                    
                </div>
                
            </div>
        </section>

        <form action="submit">
            <div class="crosses">
                <h1 id="cross">X</h1>
            </div>

            
            <div class="form">
                <div class="form_top">
                <h1 >Task Information</h1>
                
                </div>
               <div class="form_detail"> 
                <input type="text" placeholder="Enter the field (DS, Web Dev etc..)">
                <input type="text" placeholder="Enter the Task title">
                <input type="text" placeholder="Enter the About task">
                <input type="date">
                <button>Create Task</button>
               </div>
            
            </div>
        </form>
    </main>
    <script src="./task.js"></script>
</body>
</html>
