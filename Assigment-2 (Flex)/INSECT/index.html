<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INSECT</title>
    <link rel="stylesheet" href="style.css" />
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
  </head>
  <body>
    <main>
      <nav>
        <div class="title">
          <h1>INSECT</h1>
        </div>
        <div class="search">
          <input type="text" placeholder="Search..." />
        </div>
        <div class="link">
          <a href="">Home</a>
          <a href="">Shop</a>
          <a href="">About</a>
          <a href="">Gallery</a>
          <a href="">Contact</a>
        </div>
      </nav>
      <section>
        <img class="img" src="./cc-removebg-preview.png" alt="">
        <div class="left"></div>
        <div class="right">
            <div class="right-hero">
                <div class="hero-title">
                    <h1>Pachyteria <br>equestris</h1>
                </div>
                <div class="center">
                   <div>
                    <img class="cc-img" src="./cjp_sketch-removebg-preview.png" alt="">
                   </div> 
                   <div class="l-border"></div>
                   <div class="icon">
                     <h3><span class="i"><i class="ri-map-pin-2-line"></i></span>location <br> Malaysia</h3>
                     <h3><span class="i"><i class="ri-user-line"></i></span>Sex <br> Male</h3>
                     <h3><span class="i"><i class="ri-ruler-line"></i></span>Size: <br>
                     32mm/ 12mm</h3>
                   </div>
                </div>
                <div >
                    <h2 class="price">$ 5.99</h2>
                </div>
                <div>
                    <p class="para">View detailed antennae</p>
                    <p class="para">View underside</p>
                </div>

                <button>Add to collection</button>
            </div>
        </div>
      </section>
     
    </main>
